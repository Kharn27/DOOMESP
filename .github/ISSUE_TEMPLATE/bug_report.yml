name: Hardware or firmware bug
description: Report a reproducible problem on a JC3248W535 board
title: "[Bug]: "
labels: [bug]
body:
  - type: checkboxes
    attributes:
      label: Checklist
      options:
        - label: The PCB is marked JC3248W535.
          required: true
        - label: I tested the current main branch.
          required: true
        - label: I will not attach or link a commercial WAD.
          required: true

  - type: input
    attributes:
      label: Commit
      description: Output of `git rev-parse --short HEAD`
    validations:
      required: true

  - type: dropdown
    attributes:
      label: Area
      options:
        - Display
        - Touch controls
        - microSD / IWAD loading
        - Sound effects
        - Music
        - Gameplay
        - Build / upload
        - Other
    validations:
      required: true

  - type: textarea
    attributes:
      label: What happened?
      description: Include exact steps, expected behavior, and actual behavior.
    validations:
      required: true

  - type: textarea
    attributes:
      label: Serial log
      description: Paste the log from reset through the failure.
      render: text
    validations:
      required: true

  - type: textarea
    attributes:
      label: Additional context
      description: WAD family/version, SD card model, photos, or videos. Do not upload the WAD itself.

